[package]
name = "stalwart-mcp"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0"
description = "MCP server for Stalwart Mail Server — privacy-preserving AI access to mail, calendar, and contacts via JMAP"
repository = "https://github.com/webpatser/stalwart-mcp"
keywords = ["mcp", "stalwart", "jmap", "mail", "ai"]
categories = ["email", "web-programming"]

[dependencies]
anyhow = "1"
async-stream = "0.3.6"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
futures = "0.3"
jmap-client = "0.4"
jsonwebtoken = { version = "12.0.0", features = ["aws_lc_rs"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", features = ["stream", "json"] }
rmcp = { version = "1.4", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
