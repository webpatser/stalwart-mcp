[[accounts]]
name = "personal"
url = "https://mail.example.com"
username = "user@example.com"
# Password read from STALWART_PASSWORD env var by default
# password_env = "STALWART_PASSWORD"

# Add more accounts as needed:
# [[accounts]]
# name = "work"
# url = "https://mail.work.com"
# username = "user@work.com"
# password_env = "STALWART_PASSWORD_WORK"

# Or let a command print the password (argv array, run without a shell, stdin
# closed, killed after 60 s; one trailing newline is stripped). Use either
# password_env or password_command per account, not both. On Unix a config with
# a password_command must be owned by you and not writable by group or others,
# and so must its directory (chmod 600 on the file, chmod 700 on the directory).
# Not checked on Windows. Accounts are only read from this file, never from
# STALWART_MCP_* environment variables.
#
# `stalwart-mcp account add --password-source keychain` (macOS) stores the
# password in the Keychain and writes this; any process running as you can read
# such an item:
# [[accounts]]
# name = "keychain"
# url = "https://mail.example.com"
# username = "me@example.com"
# password_command = ["/usr/bin/security", "find-generic-password", "-s", "stalwart-mcp", "-a", "keychain", "-w"]
#
# `stalwart-mcp account add --password-source 1password` writes this, with the
# absolute path of op and ids instead of names (1Password asks for Touch ID
# when the server starts and the app is locked):
# [[accounts]]
# name = "onepassword"
# url = "https://mail.example.com"
# username = "me@example.com"
# password_command = ["/opt/homebrew/bin/op", "read", "-n", "--account", "<account id>", "op://<vault id>/<item id>/password"]

# Optional: first account is used as default if omitted
# default_account = "personal"

[server]
bind = "127.0.0.1:3000"

[capabilities]
# Allow sending emails via mail_send tool (default: false)
# send = true
# Allow mail_bulk_delete with permanent = true, which destroys emails beyond
# recovery (default: false). Moving them to Trash is always allowed.
# delete = true
# Allow sieve_put to create or replace Sieve filter scripts (default: false). A
# wrong script can discard or redirect incoming mail. Listing, reading and
# validating scripts is always allowed.
# sieve = true

[notifications]
# Enable JMAP EventSource for real-time notifications (default: true)
# enabled = true
# Seconds between SSE keepalive pings (default: 30)
# ping_interval = 30
